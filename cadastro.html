<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Criar Conta</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="box">

<h2>Criar Conta</h2>


<input
    id="nome"
    type="text"
    placeholder="Nome completo"
>


<input
    id="email"
    type="email"
    placeholder="Email"
>


<input
    id="senha"
    type="password"
    placeholder="Senha"
>


<input
    id="pais"
    type="text"
    placeholder="UF"
>


<input
    id="estado"
    type="text"
    placeholder="Estado"
>


<input
    id="endereco"
    type="text"
    placeholder="Endereço"
>


<input
    id="complemento"
    type="text"
    placeholder="Complemento"
>

<input
    id="bairro"
    type="text"
    placeholder="bairro"
>

<input
    id="telefone"
    type="tel"
    placeholder="Telefone"
>


<input
    id="cpf"
    type="text"
    placeholder="CPF"
>


<input
    id="identidade"
    type="text"
    placeholder="ID"
>


<input
    id="dataNascimento"
    type="date"
>


<button id="btn">
    Cadastrar
</button>


<a href="index.html">
    Já tenho conta
</a>


</div>


<script
    type="module"
    src="cadastro.js">
</script>

</body>

</html>
