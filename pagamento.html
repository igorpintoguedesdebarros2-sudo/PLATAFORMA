<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Comprar Curso</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<div class="box">

    <h2>Comprar Curso</h2>


    <p>
        Digite a ID do curso que deseja comprar.
    </p>


    <input
        type="text"
        id="cursoId"
        placeholder="Digite a ID do curso"
        autocomplete="off"
    >


    <br><br>


    <button
        type="button"
        id="solicitar"
    >
        Comprar Curso
    </button>


    <hr>


    <h2>Meus Cursos</h2>


    <div id="cursosLiberados">

        <p>
            Carregando seus cursos...
        </p>

    </div>


    <br>


    <button
        type="button"
        id="sair"
    >
        Sair
    </button>


</div>


<script
    type="module"
    src="pagamento.js"
></script>


</body>

</html>
